[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-watch"
version = "0.1.0"
description = "Orbital-element history parsing and SGP4 propagation for manoeuvre detection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sgp4>=2.23", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["orbit_watch", "orbit_watch.jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
